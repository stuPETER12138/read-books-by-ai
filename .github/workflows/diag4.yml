name: diag4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag4.yml

permissions:
  contents: write
  pages: write

jobs:
  policyprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: List and extend deployment branch policies
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies"
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          {
            echo "# Branch policy probe"
            echo
            echo "## before"
            echo '```json'
            curl -sS -H "$auth" -H "Accept: application/vnd.github+json" "$api"
            echo
            echo '```'
            echo
            echo "## add main"
            code=$(curl -sS -o /tmp/add.json -w '%{http_code}' -X POST "$api" \
              -H "$auth" -H "Accept: application/vnd.github+json" \
              -d '{"name":"main","type":"branch"}')
            echo "HTTP ${code}"
            echo '```json'
            cat /tmp/add.json
            echo
            echo '```'
            echo
            echo "## after"
            echo '```json'
            curl -sS -H "$auth" -H "Accept: application/vnd.github+json" "$api"
            echo
            echo '```'
          } > diag4.md
          cat diag4.md

      - name: Commit
        run: |
          git config user.name "diag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag4.md
          git commit -m "chore: branch policy probe" || true
          git pull --rebase origin main
          git push
