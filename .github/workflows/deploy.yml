name: Deploy mdBook

on:
  push:
    branches:
      - gas-turbine-generator-control
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-gas-turbine-generator-control
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Build book
        run: mdbook build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./book
          destination_dir: gas-turbine-generator-control
          keep_files: true
          enable_jekyll: false

      - name: Enable GitHub Pages (gh-pages branch, site root)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$api")
          echo "GET ${api} -> ${code}"
          echo "### Pages API probe" >> "$GITHUB_STEP_SUMMARY"
          echo "- GET pages: ${code}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pages.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" = "404" ]; then
            code=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "POST ${api} -> ${code}"
            echo "- POST pages: ${code}" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/create.json >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
