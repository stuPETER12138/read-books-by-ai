name: diag

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag.yml

permissions:
  contents: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe Pages settings
        run: |
          {
            echo "# Pages probe"
            echo
            echo "## GET /pages"
            echo '```json'
            curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo
            echo '```'
            echo
            echo "## repo"
            echo '```json'
            curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}" \
              | grep -E '"(default_branch|has_pages)"'
            echo '```'
          } > diag.md
          cat diag.md

      - name: Commit probe result
        run: |
          git config user.name "diag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag.md
          git commit -m "chore: pages probe result" || true
          git push
