name: Build and deploy site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - name: Checkout main (site source)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all book branches
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Build landing page and every book
        run: |
          python3 tools/build_site.py \
            --repo "${GITHUB_REPOSITORY}" \
            --base-url "/${GITHUB_REPOSITORY#*/}/" \
            --out _site

      # github-pages 环境带有部署分支白名单；不在名单里的分支照样构建，
      # 只是跳过发布，避免出现红色失败记录。
      - name: Check Pages deployment branch policy
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies"
          allowed=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$api" \
            | python3 -c "import sys,json;print(' '.join(p['name'] for p in json.load(sys.stdin).get('branch_policies',[])))")
          echo "Pages 允许部署的分支: ${allowed:-<none>}"
          if echo " ${allowed} " | grep -q " ${GITHUB_REF_NAME} "; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::分支 ${GITHUB_REF_NAME} 不在 Pages 部署白名单，本次只构建不发布（把 main 设为默认分支即可自动加入）"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_allowed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
