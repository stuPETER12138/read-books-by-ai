name: diag3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag3.yml

permissions:
  contents: write
  pages: write

jobs:
  envprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe environment
        run: |
          {
            echo "# Environment probe"
            echo
            echo "## environment: github-pages"
            echo '```json'
            curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/environments/github-pages"
            echo
            echo '```'
            echo
            echo "## environments"
            echo '```json'
            curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/environments"
            echo
            echo '```'
          } > diag3.md
          cat diag3.md

      - name: Commit
        run: |
          git config user.name "diag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag3.md
          git commit -m "chore: env probe" || true
          git pull --rebase origin main
          git push
