name: diag2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag2.yml

permissions:
  contents: write
  pages: write

jobs:
  buildprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Build site (probe)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/build_site.py \
            --repo "${GITHUB_REPOSITORY}" \
            --base-url "/${GITHUB_REPOSITORY#*/}/" \
            --out _site 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> build.log
          ls -R _site | head -40 >> build.log || true

      - name: Publish probe log
        run: |
          {
            echo "# Build probe"
            echo
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > diag2.md
          git config user.name "diag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag2.md
          git commit -m "chore: build probe" || true
          git push
