[book]
title = "燃气轮机发电机组控制系统"
authors = ["stuPETER12138"]
language = "zh-CN"
description = "燃气轮机发电机组控制系统的系统化学习笔记：启动、并网、调节、保护、辅助系统与故障诊断。"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "/read-books-by-ai/gas-turbine-generator-control/"
git-repository-url = "https://github.com/stuPETER12138/read-books-by-ai"
edit-url-template = "https://github.com/stuPETER12138/read-books-by-ai/edit/gas-turbine-generator-control/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 2

[output.html.playground]
editable = false
